{% extends 'base.html' %}

{% block title %}{{ page_title }} - Электронный журнал{% endblock %}

{% block content %}
    <h2>{{ page_title }}</h2>

    <p>Наши студенты</p>
    <ul>
        {% for student in student_list %}
        <li><a href="{% url 'student_detail' student_id=student.id %}">{{ student.last_name }} {{ student.first_name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
