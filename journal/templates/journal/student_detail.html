{% extends 'base.html' %}

{% block title %}{{ student }}{% endblock %}

{% block content %}
    <h2>{{ student.last_name }} {{ student.first_name }}</h2>
    <p>
        <strong>Группа:</strong>
        <a href="{% url 'group_detail' group_id=student.group.id %}">{{ student.group.name }}</a>
    </p>

    <hr style="margin: 20px 0;">
    <a href="{% url 'groups' %}">Назад к списку групп</a>
{% endblock %}
